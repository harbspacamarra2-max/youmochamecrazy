<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In | You Mocha Me Crazy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">

  <!-- The login card in the middle of the screen -->
  <form class="login-card" method="post" action="/">
    <div class="logo-circle">{% include 'cup.svg' %}</div>
    <h1>You Mocha Me Crazy</h1>
    <p class="muted">Sign in to start taking orders</p>

    <!-- Show the error message only if there is one -->
    {% if error %}
      <div class="alert">{{ error }}</div>
    {% endif %}

    <label for="username">Username</label>
    <input id="username" name="username" type="text" placeholder="Enter your username"
           value="{{ username }}" required autofocus>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" placeholder="Enter your password" required>

    <button type="submit" class="btn-primary">Sign In</button>
  </form>

</body>
</html>
